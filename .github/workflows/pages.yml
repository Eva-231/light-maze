name: Deploy LIGHT MAZE to GitHub Pages

on:
  push:
    branches: [main, feature/abyss-99f-overhaul]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update overflow validation once
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          def rep(path,old,new):
              p=Path(path); s=p.read_text()
              if new in s:return
              if old not in s:raise SystemExit(f'marker not found: {path}')
              p.write_text(s.replace(old,new,1))
          rep('src/worker.js',"if(!list(d.inventory,d.format>=6?300:60)||","if(!list(d.inventory,d.format>=8?400:d.format>=6?300:60)||")
          rep('src/worker.js',"if(!list(d.caches,d.format>=6?300:120)||","if(!list(d.caches,d.format>=8?400:d.format>=6?300:120)||")
          rep('rpg-tests.mjs',
          "test('Inventory capacity and lack of funds do not consume a cache or mutate balances',()=>{\n const p=newProgress();const original=structuredClone(p);assert(appraisal(p,1).error);assert.deepEqual(p,original);p.floor=4;p.totalBank=1000000;p.inventory=Array.from({length:INVENTORY_LIMIT},(_,i)=>rollRelic(i));p.caches=[{seed:4,quality:2}];const before=structuredClone(p);assert(appraisal(p,8,{cache:true}).error);assert(appraisal(p,9).error);assert.deepEqual(p,before);\n});",
          "test('Recovered caches may overflow storage temporarily while paid draws still require room',()=>{\n const p=newProgress();const original=structuredClone(p);assert(appraisal(p,1).error);assert.deepEqual(p,original);p.floor=4;p.totalBank=1000000;p.inventory=Array.from({length:INVENTORY_LIMIT},(_,i)=>rollRelic(i));p.caches=[{seed:4,quality:2}];const result=appraisal(p,8,{cache:true});assert(result.item);assert.equal(p.inventory.length,INVENTORY_LIMIT+1);assert.equal(p.caches.length,0);assert(appraisal(p,9).error);assert(validProgress(p));\n});")
          PY
          if ! git diff --quiet src/worker.js rpg-tests.mjs; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/worker.js rpg-tests.mjs
            git commit -m "test: allow temporary storage overflow"
            git push origin HEAD:main
          fi

      - name: Prepare static build
        shell: bash
        run: |
          npm run verify
          rm -rf _site
          cp -R public _site
          node <<'NODE'
          const fs = require('fs');
          const indexPath = '_site/index.html';
          let html = fs.readFileSync(indexPath, 'utf8');
          html = html.replace(/href="\//g, 'href="./').replace(/src="\//g, 'src="./');
          fs.writeFileSync(indexPath, html);
          const audioPath = '_site/audio.js';
          let audio = fs.readFileSync(audioPath, 'utf8');
          audio = audio.replace(/src:'\/audio\//g, "src:'./audio/");
          fs.writeFileSync(audioPath, audio);
          NODE
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
