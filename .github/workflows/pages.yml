name: Deploy LIGHT MAZE to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static build
        run: |
          rm -rf _site
          cp -R public _site
          node <<'NODE'
          const fs = require('fs');

          // GitHub project pages live under /light-maze/, so only rewrite
          // browser resource URLs that are actually site-root absolute.
          const indexPath = '_site/index.html';
          let html = fs.readFileSync(indexPath, 'utf8');
          html = html
            .replace(/href="\//g, 'href="./')
            .replace(/src="\//g, 'src="./');
          fs.writeFileSync(indexPath, html);

          // Audio() resolves these URLs against the page URL. Keep all JS
          // source code otherwise untouched so regex literals remain valid.
          const audioPath = '_site/audio.js';
          let audio = fs.readFileSync(audioPath, 'utf8');
          audio = audio.replace(/src:'\/audio\//g, "src:'./audio/");
          fs.writeFileSync(audioPath, audio);
          NODE
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
