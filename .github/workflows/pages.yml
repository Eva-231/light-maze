name: Deploy LIGHT MAZE to GitHub Pages

on:
  push:
    branches: [main, feature/abyss-99f-overhaul]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply base HP regeneration patch once
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('public/game.js')
          s=p.read_text()
          marker="state.elapsed+=dt;const dist=homeDistance(state.x,state.z);"
          replacement="state.elapsed+=dt;if(state.hp<stats.maxHp&&state.elapsed-(state.lastDamageAt??-1e9)>=5)state.hp=Math.min(stats.maxHp,state.hp+stats.maxHp*.005*dt);const dist=homeDistance(state.x,state.z);"
          if replacement not in s:
              if marker not in s: raise SystemExit('regen insertion marker not found')
              s=s.replace(marker,replacement,1)
          damage="state.hp=hit.hp;state.damageTaken+=damage;"
          damage_replacement="state.hp=hit.hp;state.lastDamageAt=state.elapsed;state.damageTaken+=damage;"
          if damage_replacement not in s:
              if damage not in s: raise SystemExit('damage timestamp marker not found')
              s=s.replace(damage,damage_replacement,1)
          p.write_text(s)

          wf=Path('.github/workflows/pages.yml')
          wf.write_text('''name: Deploy LIGHT MAZE to GitHub Pages\n\non:\n  push:\n    branches: [main, feature/abyss-99f-overhaul]\n  workflow_dispatch:\n\npermissions:\n  contents: read\n  pages: write\n  id-token: write\n\nconcurrency:\n  group: pages\n  cancel-in-progress: true\n\njobs:\n  deploy:\n    environment:\n      name: github-pages\n      url: ${{ steps.deployment.outputs.page_url }}\n    runs-on: ubuntu-latest\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v4\n\n      - name: Prepare static build\n        # Fail before publication if game/save regression tests fail.\n        shell: bash\n        run: |\n          npm run verify\n          rm -rf _site\n          cp -R public _site\n          node <<'NODE'\n          const fs = require('fs');\n\n          // GitHub project pages live under /light-maze/, so only rewrite\n          // browser resource URLs that are actually site-root absolute.\n          const indexPath = '_site/index.html';\n          let html = fs.readFileSync(indexPath, 'utf8');\n          html = html\n            .replace(/href=\"\\//g, 'href=\"./')\n            .replace(/src=\"\\//g, 'src=\"./');\n          fs.writeFileSync(indexPath, html);\n\n          // Audio() resolves these URLs against the page URL. Keep all JS\n          // source code otherwise untouched so regex literals remain valid.\n          const audioPath = '_site/audio.js';\n          let audio = fs.readFileSync(audioPath, 'utf8');\n          audio = audio.replace(/src:'\\/audio\\//g, \"src:'./audio/\");\n          fs.writeFileSync(audioPath, audio);\n          NODE\n          touch _site/.nojekyll\n\n      - name: Configure Pages\n        uses: actions/configure-pages@v5\n\n      - name: Upload artifact\n        uses: actions/upload-pages-artifact@v3\n        with:\n          path: _site\n\n      - name: Deploy\n        id: deployment\n        uses: actions/deploy-pages@v4\n''')
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/game.js .github/workflows/pages.yml
          git commit -m "balance: add baseline HP regeneration"
          git push origin HEAD:main

      - name: Prepare static build
        shell: bash
        run: |
          npm run verify
          rm -rf _site
          cp -R public _site
          node <<'NODE'
          const fs = require('fs');
          const indexPath = '_site/index.html';
          let html = fs.readFileSync(indexPath, 'utf8');
          html = html.replace(/href="\//g, 'href="./').replace(/src="\//g, 'src="./');
          fs.writeFileSync(indexPath, html);
          const audioPath = '_site/audio.js';
          let audio = fs.readFileSync(audioPath, 'utf8');
          audio = audio.replace(/src:'\/audio\//g, "src:'./audio/");
          fs.writeFileSync(audioPath, audio);
          NODE
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
